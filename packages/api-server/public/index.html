<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Consensus AI — Agent Dashboard</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0d1117; color: #e6edf3; min-height: 100vh; }
  header { background: #161b22; border-bottom: 1px solid #30363d; padding: 16px 24px; display: flex; align-items: center; gap: 12px; }
  header h1 { font-size: 18px; font-weight: 600; color: #58a6ff; }
  .badge { background: #238636; color: #fff; font-size: 11px; padding: 2px 8px; border-radius: 12px; font-weight: 600; }
  .badge.idle { background: #6e7681; }
  main { max-width: 960px; margin: 0 auto; padding: 24px; }
  .section { margin-bottom: 32px; }
  .section-title { font-size: 13px; font-weight: 600; color: #8b949e; text-transform: uppercase; letter-spacing: .06em; margin-bottom: 12px; }
  .empty { background: #161b22; border: 1px dashed #30363d; border-radius: 8px; padding: 32px; text-align: center; color: #6e7681; font-size: 14px; }
  .card { background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 16px; margin-bottom: 10px; }
  .card-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 8px; }
  .card-title { font-size: 14px; font-weight: 600; }
  .card-meta { font-size: 12px; color: #8b949e; margin-top: 4px; }
  .tag { display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 4px; font-weight: 600; margin-right: 4px; }
  .tag-tool { background: #1f3a6e; color: #79c0ff; }
  .tag-role { background: #2d1b6e; color: #c084fc; }
  .tag-op { background: #1a3a2a; color: #3fb950; }
  .rationale { font-size: 13px; color: #8b949e; margin: 8px 0; line-height: 1.5; }
  .actions { display: flex; gap: 8px; margin-top: 12px; }
  button { padding: 6px 16px; border-radius: 6px; border: none; font-size: 13px; font-weight: 600; cursor: pointer; transition: opacity .15s; }
  button:hover { opacity: .85; }
  button:disabled { opacity: .4; cursor: not-allowed; }
  .btn-approve { background: #238636; color: #fff; }
  .btn-deny { background: #21262d; color: #f85149; border: 1px solid #f85149; }
  .status-dot { width: 8px; height: 8px; border-radius: 50%; background: #238636; display: inline-block; margin-right: 6px; animation: pulse 2s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }
  .stat-row { display: flex; gap: 16px; margin-bottom: 24px; }
  .stat { background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 14px 20px; flex: 1; }
  .stat-num { font-size: 28px; font-weight: 700; color: #58a6ff; }
  .stat-label { font-size: 12px; color: #8b949e; margin-top: 2px; }
  .audit-row { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid #21262d; font-size: 13px; }
  .audit-row:last-child { border-bottom: none; }
  .audit-time { color: #6e7681; font-size: 11px; min-width: 80px; }
  .audit-action { color: #79c0ff; font-weight: 600; min-width: 160px; }
  .audit-detail { color: #8b949e; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .refresh-note { font-size: 11px; color: #6e7681; margin-top: 8px; }
  .toast { position: fixed; bottom: 24px; right: 24px; background: #238636; color: #fff; padding: 10px 18px; border-radius: 8px; font-size: 13px; font-weight: 600; opacity: 0; transition: opacity .3s; pointer-events: none; }
  .toast.show { opacity: 1; }
  .toast.error { background: #da3633; }
</style>
</head>
<body>
<header>
  <span class="status-dot" id="dot"></span>
  <h1>Consensus AI</h1>
  <span class="badge idle" id="statusBadge">Connecting...</span>
</header>

<main>
  <div class="stat-row">
    <div class="stat"><div class="stat-num" id="statPending">—</div><div class="stat-label">Pending approvals</div></div>
    <div class="stat"><div class="stat-num" id="statAudit">—</div><div class="stat-label">Audit events today</div></div>
    <div class="stat"><div class="stat-num" id="statProjects">—</div><div class="stat-label">Active projects</div></div>
  </div>

  <div class="section">
    <div class="section-title">Pending Approvals</div>
    <div id="approvals"><div class="empty">No pending approvals — agent loop is either idle or auto-approved.</div></div>
    <div class="refresh-note">Auto-refreshes every 5 seconds</div>
  </div>

  <div class="section">
    <div class="section-title">Recent Audit Events</div>
    <div class="card" id="auditLog"><div style="color:#6e7681;font-size:13px">Loading...</div></div>
  </div>
</main>

<div class="toast" id="toast"></div>

<script>
const $ = id => document.getElementById(id);

function showToast(msg, err = false) {
  const t = $('toast');
  t.textContent = msg;
  t.className = 'toast show' + (err ? ' error' : '');
  setTimeout(() => t.className = 'toast', 2500);
}

function timeAgo(iso) {
  const s = (Date.now() - new Date(iso)) / 1000;
  if (s < 60) return `${Math.floor(s)}s ago`;
  if (s < 3600) return `${Math.floor(s/60)}m ago`;
  return `${Math.floor(s/3600)}h ago`;
}

async function loadApprovals() {
  try {
    const res = await fetch('/approvals/pending');
    const rows = await res.json();
    $('statPending').textContent = rows.length;
    const el = $('approvals');
    if (!rows.length) {
      el.innerHTML = '<div class="empty">No pending approvals — agent loop is either idle or auto-approved.</div>';
      return;
    }
    el.innerHTML = rows.map(r => `
      <div class="card" id="card-${r.id}">
        <div class="card-header">
          <div>
            <div class="card-title">
              <span class="tag tag-role">${r.agent_role}</span>
              wants to use
              <span class="tag tag-tool">${r.tool}</span>
              <span class="tag tag-op">${r.operation}</span>
            </div>
            <div class="card-meta">${timeAgo(r.created_at)} · project: ${r.project_id?.slice(0,8) ?? 'n/a'}</div>
          </div>
        </div>
        <div class="rationale">${r.rationale}</div>
        <div class="actions">
          <button class="btn-approve" onclick="decide('${r.id}','approve')">✓ Approve</button>
          <button class="btn-deny" onclick="decide('${r.id}','deny')">✕ Deny</button>
        </div>
      </div>`).join('');
  } catch { /* server not ready yet */ }
}

async function decide(id, action) {
  const card = document.getElementById('card-' + id);
  card.querySelectorAll('button').forEach(b => b.disabled = true);
  try {
    await fetch(`/approvals/${id}/${action}`, { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({reviewedBy:'dashboard'}) });
    showToast(action === 'approve' ? '✓ Approved' : '✕ Denied', action === 'deny');
    card.style.opacity = '.4';
    setTimeout(() => { card.remove(); loadApprovals(); }, 800);
  } catch(e) {
    showToast('Request failed', true);
    card.querySelectorAll('button').forEach(b => b.disabled = false);
  }
}

async function loadAudit() {
  try {
    const res = await fetch('/audit?limit=15');
    const rows = await res.json();
    $('statAudit').textContent = rows.length;
    $('auditLog').innerHTML = rows.length
      ? rows.map(r => `<div class="audit-row">
          <span class="audit-time">${timeAgo(r.createdAt)}</span>
          <span class="audit-action">${r.actionType}</span>
          <span class="audit-detail">${r.toolName ? r.toolName + ' · ' : ''}${r.inputSummary ?? ''}</span>
        </div>`).join('')
      : '<div style="color:#6e7681;font-size:13px">No events yet.</div>';
  } catch { /* not ready */ }
}

async function loadProjects() {
  try {
    const res = await fetch('/projects?status=running');
    const data = await res.json();
    $('statProjects').textContent = Array.isArray(data) ? data.length : '—';
  } catch { }
}

async function checkHealth() {
  try {
    const r = await fetch('/health');
    const d = await r.json();
    if (d.status === 'ok') {
      $('statusBadge').textContent = 'Live';
      $('statusBadge').className = 'badge';
      $('dot').style.background = '#238636';
    }
  } catch {
    $('statusBadge').textContent = 'Offline';
    $('statusBadge').className = 'badge idle';
    $('dot').style.background = '#da3633';
  }
}

async function refresh() {
  await Promise.all([checkHealth(), loadApprovals(), loadAudit(), loadProjects()]);
}

refresh();
setInterval(refresh, 5000);
</script>
</body>
</html>
